[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "broker-ai"
version = "0.7.1"
description = "Veilige leeromgeving voor de ontwikkeling van Broker AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = []

[project.scripts]
broker-ai = "broker_ai.main:main"

[tool.setuptools.packages.find]
where = ["src"]
