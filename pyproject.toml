[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "broker-ai"
version = "0.4.0"
description = "Veilige leeromgeving voor de ontwikkeling van Broker AI"
requires-python = ">=3.11"

[project.scripts]
broker-ai = "broker_ai.main:main"

[tool.setuptools.packages.find]
where = ["src"]
